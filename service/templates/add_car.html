<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Car | AutoCare</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
            linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
            url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1600&auto=format&fit=crop');
            background-size:cover;
            background-position:center;
        }

        .container{
            width:420px;
            background:rgba(20,20,20,0.92);
            padding:40px;
            border-radius:20px;
            box-shadow:0 0 25px rgba(0,0,0,0.5);
            color:white;
            backdrop-filter:blur(6px);
        }

        .container h1{
            text-align:center;
            margin-bottom:30px;
            color:#ffb703;
            font-size:34px;
            letter-spacing:1px;
        }

        form p{
            margin-bottom:18px;
        }

        form label{
            display:block;
            margin-bottom:8px;
            font-size:15px;
            color:#ddd;
        }

        form input,
        form select,
        form textarea{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            outline:none;
            background:#2b2b2b;
            color:white;
            font-size:15px;
            transition:0.3s;
        }

        form input:focus,
        form select:focus,
        form textarea:focus{
            border:2px solid #ffb703;
            background:#1f1f1f;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:#ffb703;
            color:black;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        button:hover{
            background:#ffaa00;
            transform:translateY(-2px);
            box-shadow:0 5px 15px rgba(255,183,3,0.4);
        }

        .back-btn{
            display:block;
            text-align:center;
            margin-top:20px;
            text-decoration:none;
            color:#ffb703;
            font-size:15px;
            transition:0.3s;
        }

        .back-btn:hover{
            color:white;
        }

        @media(max-width:500px){
            .container{
                width:90%;
                padding:30px 20px;
            }

            .container h1{
                font-size:28px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚗 Add New Car</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save Car</button>
    </form>

    <a href="{% url 'customer_dashboard' %}" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>

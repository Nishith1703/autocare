<!DOCTYPE html>

<html>
<head>
    <title>AutoCare Login</title>

```
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;

        /* BACKGROUND IMAGE */
        background:linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
        url("https://images.unsplash.com/photo-1487754180451-c456f719a1fc?auto=format&fit=crop&w=1600&q=80");

        background-size:cover;
        background-position:center;
        background-repeat:no-repeat;
    }

    .container{
        width:400px;
        padding:40px;
        border-radius:18px;

        /* GLASS EFFECT */
        background:rgba(255,255,255,0.15);
        backdrop-filter:blur(15px);

        box-shadow:0 20px 50px rgba(0,0,0,0.6);
        text-align:center;
        color:white;
    }

    .container h1{
        margin-bottom:5px;
        color:#ffb703;
        font-size:32px;
    }

    .container p{
        margin-bottom:25px;
        color:#ddd;
    }

    input{
        width:100%;
        padding:14px;
        margin:10px 0;
        border:none;
        outline:none;
        border-radius:10px;
        background:rgba(255,255,255,0.9);
        font-size:15px;
    }

    button{
        width:100%;
        padding:14px;
        margin-top:15px;
        border:none;
        border-radius:10px;
        background:#ffb703;
        color:#111;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#ffd166;
    }

    .error{
        margin-top:12px;
        color:#ff6b6b;
        font-weight:bold;
    }

    .link{
        margin-top:18px;
        font-size:14px;
    }

    .link a{
        color:#ffb703;
        text-decoration:none;
        font-weight:bold;
    }

    .link a:hover{
        text-decoration:underline;
    }
</style>
```

</head>

<body>

<div class="container">
    <h1>AutoCare</h1>
    <p>Customer Login</p>

```
<form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Enter Username" required>
    <input type="password" name="password" placeholder="Enter Password" required>

    <button type="submit">Login</button>
</form>

{% if error %}
    <div class="error">{{ error }}</div>
{% endif %}

<div class="link">
    Don't have an account? 
    <a href="{% url 'signup' %}">Sign Up</a>
</div>
```

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>

<style>
body{
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

.box{
    background:#1e1e1e;
    padding:30px;
    border-radius:10px;
    width:350px;
}

h2{
    text-align:center;
    color:#ffb703;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:6px;
}

button{
    width:100%;
    padding:10px;
    background:#ffb703;
    border:none;
    border-radius:8px;
}

.msg{
    text-align:center;
    margin-top:10px;
    color:lightgreen;
}
</style>
</head>

<body>

<div class="box">
    <h2>Reset Password</h2>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Enter Username">
        <input type="password" name="new_password" placeholder="New Password">
        <button type="submit">Reset</button>
    </form>

    <div class="msg">{{ message }}</div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile | AutoCare</title>

<style>
body{
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:420px;
    background:#1b1b1b;
    padding:35px;
    border-radius:15px;
}

h1{
    text-align:center;
    color:#ffb703;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
    background:#2a2a2a;
    color:white;
}

button{
    width:100%;
    padding:12px;
    background:#ffb703;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ffaa00;
}

.msg{
    text-align:center;
    color:lightgreen;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="box">
    <h1>My Profile</h1>

    {% if message %}
    <div class="msg">{{ message }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="name" value="{{ customer.name }}" placeholder="Name">
        <input type="text" name="phone" value="{{ customer.phone }}" placeholder="Phone">
        <input type="text" name="address" value="{{ customer.address }}" placeholder="Address">

        <input type="password" name="new_password" placeholder="New Password">

        <button type="submit">Update Profile</button>
    </form>

    <br>
    <a href="{% url 'customer_dashboard' %}" style="color:#ffb703;">← Back</a>
</div>

</body>
</html>
